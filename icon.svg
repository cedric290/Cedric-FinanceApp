<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Geldschein (grün = Einnahmen) schaut aus der Geldbörse -->
  <rect x="150" y="104" width="212" height="110" rx="18" fill="#4ade80"/>
  <circle cx="256" cy="150" r="22" fill="#15803d" opacity=".35"/>
  <!-- Geldbörse -->
  <rect x="96" y="172" width="320" height="236" rx="44" fill="#ffffff"/>
  <rect x="304" y="246" width="136" height="92" rx="30" fill="#1d4ed8"/>
  <circle cx="348" cy="292" r="15" fill="#ffffff"/>
  <!-- Euro-Zeichen -->
  <text x="198" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="700" fill="#1d4ed8" text-anchor="middle">€</text>
</svg>
